[project]
name = "nutanix-mcp-server"
version = "0.4.0"
description = "MCP server for Nutanix Prism Central & Prism Element APIs"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = []
keywords = ["mcp", "nutanix", "prism-central", "prism-element", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.10.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "fastapi>=0.110.0",
    "ntnx-vmm-py-client>=4.0.0,<4.2",
    "ntnx-clustermgmt-py-client>=4.0.0,<4.2",
    "ntnx-networking-py-client>=4.0.0,<4.2",
    "ntnx-prism-py-client>=4.0.0,<4.2",
    "ntnx-dataprotection-py-client>=4.0.0,<4.2",
]

[project.optional-dependencies]
# Authenticated management API (management_api.py). fastapi/uvicorn are already
# core dependencies; this group adds JWT session signing.
api = [
    "pyjwt>=2.8.0,<3.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
nutanix-mcp = "nutanix_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutanix_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["mcp.*", "httpx.*", "ntnx_vmm_py_client.*", "ntnx_clustermgmt_py_client.*", "ntnx_networking_py_client.*", "ntnx_prism_py_client.*", "ntnx_dataprotection_py_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
